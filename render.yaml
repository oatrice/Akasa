services:
  - type: web
    name: akasa-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.9.6
      - key: AKASA_API_KEY
        generateValue: true
      - key: WEBHOOK_SECRET_TOKEN
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: akasa-redis
          property: connectionString

  - type: redis
    name: akasa-redis
    ipAllowList: [] # restrict access to internal connections only
