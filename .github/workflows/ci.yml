name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          
      - name: Run Ruff linter
        run: ruff check app/ scripts/ tests/ --ignore E501,F401 --output-format=github
        
      - name: Run Ruff formatter check
        run: ruff format --check app/ scripts/ tests/

  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Python tests
        env:
          REDIS_URL: "redis://localhost:6379"
          AKASA_API_KEY: ${{ secrets.AKASA_API_KEY || 'test-api-key' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || 'test-bot-token' }}
          AKASA_CHAT_ID: ${{ secrets.AKASA_CHAT_ID || '123456789' }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term
          
      - name: Run MCP server tests
        env:
          REDIS_URL: "redis://localhost:6379"
          AKASA_API_KEY: ${{ secrets.AKASA_API_KEY || 'test-api-key' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || 'test-bot-token' }}
          AKASA_CHAT_ID: ${{ secrets.AKASA_CHAT_ID || '123456789' }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest tests/scripts/ -v --tb=short

  notify:
    needs: [lint, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PIPELINE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title || 'Manual Trigger' }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram credentials not configured, skipping notification"
            exit 0
          fi
          
          if [ "$LINT_RESULT" == "success" ] && [ "$TEST_RESULT" == "success" ]; then
            STATUS_MSG="✅ *Akasa CI Succeeded*"
          else
            STATUS_MSG="❌ *Akasa CI Failed*"
          fi
          
          MESSAGE="${STATUS_MSG}%0A📦 Repo: \`${{ github.repository }}\`%0A🌿 Branch: \`${{ github.ref_name }}\`%0A👤 Author: ${{ github.actor }}%0A📝 Commit: \`${COMMIT_MSG}\`%0A🔗 [View Run](${PIPELINE_URL})"
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="${MESSAGE}"
